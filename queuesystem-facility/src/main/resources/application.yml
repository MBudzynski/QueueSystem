server:
  port: 8086

spring.jpa:
  database: POSTGRESQL
  hibernate.ddl-auto: validate
  show-sql: true

spring.datasource:
  driverClassName: org.postgresql.Driver
  url: jdbc:postgresql://localhost:5432/queue-system-example-facility
  username: ${DB_USERNAME}
  password: ${DB_PASSWORD}

spring:
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    virtual-host: ${RABBITMQ_VHOST}

http:
  client:
    queue-system-core:
      base-url: ${QUEUE_SYSTEM_CORE_BASE_URL:http://localhost:8085}

custom:
  configuration:
    queue-name: ${FACILITY_QUEUE_NAME}
    facilityId: ${FACILITY_ID:1}
    facilityUUID: ${FACILITY_UUID:27f7a5cb-9002-4af5-a0a7-f169d20eafd7}

  schedule:
    synchronize-queue-configuration:
      cron: 0 0/30 6-20 * * *
      enable: true
  queue:
    delay-time-minutes: 5

